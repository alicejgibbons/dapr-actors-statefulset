apiVersion: v1
kind: ServiceAccount
metadata:
  name: actor-client
  namespace: actors-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actor-client-pod-reader
  namespace: actors-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-client-pod-reader
  namespace: actors-demo
subjects:
  - kind: ServiceAccount
    name: actor-client
    namespace: actors-demo
roleRef:
  kind: Role
  name: actor-client-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actor-client
  namespace: actors-demo
  labels:
    app: actor-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actor-client
  template:
    metadata:
      labels:
        app: actor-client
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "actor-client"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: actor-client
      containers:
        - name: actor-client
          image: dapr-actors-statefulset/actor-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACTOR_TYPE_PREFIX
              value: "WorkerActor"
            - name: ACTOR_HOST_LABEL_SELECTOR
              value: "app=actor-host"
            - name: FULL_RESYNC_INTERVAL_SECONDS
              value: "300"
            - name: ASSIGN_INTERVAL_SECONDS
              value: "2"
            - name: JOB_GENERATOR_ENABLED
              value: "true"
            - name: JOB_GENERATOR_INTERVAL_SECONDS
              value: "15"
            - name: JOB_DURATION_MS_MIN
              value: "20000"
            - name: JOB_DURATION_MS_MAX
              value: "35000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: actor-client
  namespace: actors-demo
  labels:
    app: actor-client
spec:
  selector:
    app: actor-client
  ports:
    - name: http
      port: 8080
      targetPort: 8080
